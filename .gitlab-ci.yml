# GitLab CI/CD Pipeline for Next.js Portfolio

image: node:20-alpine

stages:
  - install
  - test
  - build
  - docker

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

# Cache node modules and Next.js cache across pipeline stages
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
    - .next/cache/

# Step 1: Install Dependencies
install_dependencies:
  stage: install
  script:
    - npm ci --prefer-offline --no-audit
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# Step 2: Lint
lint:
  stage: test
  needs: ["install_dependencies"]
  script:
    - npm run lint

# Step 3: Production Build
build:
  stage: build
  needs: ["install_dependencies"]
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day

# Step 4: Docker Image Build & Push (GitLab Container Registry)
docker_build:
  stage: docker
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    # Runs manually on default branch (main/master)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
